syntax = "proto3";

package lightnode;

service LightNode {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetTickTransactions(GetTickTransactionsRequest) returns (GetTickTransactionsResponse);
  rpc QueryContractFunction(QueryContractFunctionRequest) returns (QueryContractFunctionResponse);
  rpc BroadcastTransaction(BroadcastTransactionRequest) returns (BroadcastTransactionResponse);
}

message GetStatusRequest {}

message TickStatus {
  uint32 epoch = 1;
  uint32 tick = 2;
  // BroadcastTick does not provide initial_tick or tick_duration_ms. The
  // structurally parsed cache currently exposes only epoch and tick.
  uint32 initial_tick = 3;
  uint32 tick_duration_ms = 4;
  uint32 aligned_votes = 5;
  uint32 misaligned_votes = 6;
}

message GetStatusResponse {
  bool ok = 1;
  string source = 2;
  TickStatus status = 3;
  string warning = 4;
  string error = 5;
}

message GetTickTransactionsRequest {
  uint32 tick = 1;
}

message GetTickTransactionsResponse {
  bool ok = 1;
  uint32 tick = 2;
  // Derived from the transaction-digest array in a FourQ-verified Core TickData.
  bool has_transactions = 3;
  string error = 4;
}

message QueryContractFunctionRequest {
  uint32 contract_index = 1;
  uint32 input_type = 2;
  bytes input = 3;
}

message QueryContractFunctionResponse {
  bool ok = 1;
  // A successful Core response is non-empty. Empty output is reported as an error.
  bytes output = 2;
  string error = 3;
}

message BroadcastTransactionRequest {
  bytes tx_bytes = 1;
}

message BroadcastTransactionResponse {
  bool ok = 1;
  // Canonical lowercase 60-character Qubic identity derived from K12(tx_bytes).
  string tx_id = 2;
  string error = 3;
}
