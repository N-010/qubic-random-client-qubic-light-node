name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'schedule' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install security tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2

      - name: RustSec audit
        run: cargo audit

      - name: Dependency policy
        run: cargo deny check advisories licenses sources

  release-build:
    needs: [ test, security ]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check release tag matches package version
        shell: python
        run: |
          import json
          import os
          import subprocess
          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--locked", "--format-version", "1"], text=True
          ))
          version = next(p["version"] for p in metadata["packages"] if p["name"] == "QubicLightNode")
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must match Cargo.toml: v{version}")

      - name: Build (release)
        run: cargo build --release --locked

      - name: Check binary and prepare checksum
        shell: python
        run: |
          import hashlib
          import os
          import pathlib
          import shutil
          import subprocess
          name = "QubicLightNode.exe" if os.name == "nt" else "QubicLightNode"
          binary = pathlib.Path("target/release", name).resolve()
          version = subprocess.check_output([str(binary), "--version"], text=True, timeout=30).strip()
          expected = f"QubicLightNode {os.environ['RELEASE_TAG'][1:]}"
          if version != expected:
              raise SystemExit(f"Binary version mismatch: expected {expected}, got {version}")
          subprocess.run([str(binary), "--help"], check=True, timeout=30)
          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)
          output = dist / name
          shutil.copy2(binary, output)
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          (dist / f"{name}.sha256").write_text(f"{digest}  {name}\n", encoding="ascii")

      - name: Upload checked binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [ release-build ]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-ubuntu-latest
          path: dist

      - name: Download Windows binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows-latest
          path: dist

      - name: Verify complete release and checksums
        shell: python
        run: |
          import hashlib
          import pathlib
          dist = pathlib.Path("dist")
          checksums = []
          for name in ("QubicLightNode", "QubicLightNode.exe"):
              binary = dist / name
              if binary.stat().st_size == 0:
                  raise SystemExit(f"Empty release binary: {name}")
              digest = hashlib.sha256(binary.read_bytes()).hexdigest()
              expected = f"{digest}  {name}\n"
              if (dist / f"{name}.sha256").read_text(encoding="ascii") != expected:
                  raise SystemExit(f"Checksum mismatch: {name}")
              checksums.append(expected)
          (dist / "QubicLightNode").chmod(0o755)
          (dist / "SHA256SUMS").write_text("".join(checksums), encoding="ascii")

      - name: Publish complete release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/QubicLightNode
            dist/QubicLightNode.exe
            dist/SHA256SUMS
