[package]
name = "QubicLightNode"
version = "2.0.2"
edition = "2024"
description = "Outbound-only Qubic backend for RandomClient"
license = "MIT"
repository = "https://github.com/N-010/qubic-random-client-qubic-light-node"
readme = "README.md"

[workspace]
members = [".", "crates/qubic-fourq-verifier"]
resolver = "3"

[dependencies]
blake3 = "1.8.2"
bytes = "1.10.1"
clap = { version = "4.5.38", features = ["derive"] }
prost = "0.13.5"
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
qubic-fourq-verifier = { path = "crates/qubic-fourq-verifier" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
socket2 = "0.5"
tokio = { version = "1.48.0", features = ["full"] }
tonic = { version = "0.12.3", features = ["transport"] }
tiny-keccak = { version = "2.0.2", features = ["k12"] }

[build-dependencies]
protoc-bin-vendored = "3.1.0"
tonic-build = "0.12.3"

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.7.0"
qubic-fourq-verifier = { path = "crates/qubic-fourq-verifier", features = ["test-signing"] }

# The FourQ implementation intentionally relies on wrapping integer
# arithmetic. Keep overflow checks enabled for this crate and disable them only
# for the local verifier in non-release builds.
[profile.dev.package.qubic-fourq-verifier]
overflow-checks = false

[profile.test.package.qubic-fourq-verifier]
overflow-checks = false
